[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard-ai"
version = "1.0.0"
description = "Sistema Inteligente de Detecção de Fraudes — Mini Capstone Pós-IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FraudGuard AI Team" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pyarrow>=17.0.0,<20.0.0",
    "joblib>=1.4.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "streamlit>=1.39.0,<2.0.0",
    "plotly>=5.24.0,<6.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

